    description: Dedicated PATI calculation branch.
    kind: sqft
    script_key: sqft_script
    event: item_code
    given:
      rows:
        - case: pati_positive_quantity
          source_row:
            Sales Order: SAL-ORD-2026-00702
            Order Date: 28-05-2026
            Customer Name: Reva Mohit
            Item Name: KOTA PATI
            Height: 23.0
            Width: 3.0
            Cut From Height: 24.0
            Cut From Width: 12.0
            Quantity: 25.0
            SQFT: 50.0
            Rate: 12.0
            Amount: 600.0
            Status: To Deliver and Bill
