version: 2

# dbt-style row contracts selected from the analysis in
# `sales_order_item_data_analysis.md`.
#
# Every case embeds all 13 columns copied from its source CSV record. These are
# editable unit-test contracts: the guard requires all columns but allows the
# values to be changed for a scenario.
